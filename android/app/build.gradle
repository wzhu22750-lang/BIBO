apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

def releaseKeystorePath = System.getenv('BIBU_RELEASE_KEYSTORE') ?: System.getenv('BIBO_RELEASE_KEYSTORE')
def releaseStorePassword = System.getenv('BIBU_RELEASE_STORE_PASSWORD') ?: System.getenv('BIBO_RELEASE_STORE_PASSWORD')
def releaseKeyAlias = System.getenv('BIBU_RELEASE_KEY_ALIAS') ?: System.getenv('BIBO_RELEASE_KEY_ALIAS')
def releaseKeyPassword = System.getenv('BIBU_RELEASE_KEY_PASSWORD') ?: System.getenv('BIBO_RELEASE_KEY_PASSWORD')
def releaseSigningReady = [releaseKeystorePath, releaseStorePassword, releaseKeyAlias, releaseKeyPassword].every { value ->
    value != null && !value.trim().isEmpty()
}
def requestedVersionCode = System.getenv('BIBU_VERSION_CODE') ?: System.getenv('BIBO_VERSION_CODE')
def requestedVersionName = System.getenv('BIBU_VERSION_NAME') ?: System.getenv('BIBO_VERSION_NAME')
def loadEnvReleaseValue = { key ->
    def envFile = file("${rootDir}/../.env.release")
    if (envFile.exists()) {
        def line = envFile.readLines().find { it.trim().startsWith("${key}=") }
        if (line) return line.split('=', 2)[1].trim()
    }
    return null
}
def getuiAppId = System.getenv('GETUI_APP_ID') ?: System.getenv('GT_APP_ID') ?: loadEnvReleaseValue('GETUI_APP_ID') ?: ''
def versionCodeValue = requestedVersionCode?.isInteger() ? requestedVersionCode.toInteger() : 1
def versionNameValue = requestedVersionName?.trim() ?: '0.1.0'

android {
    kotlinOptions { jvmTarget = "21" }
    compileOptions { sourceCompatibility JavaVersion.VERSION_21; targetCompatibility JavaVersion.VERSION_21 }
    namespace = "love.bibu.space"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "love.bibu.space"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode versionCodeValue
        versionName versionNameValue
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
        manifestPlaceholders = [
            GETUI_APPID: getuiAppId,
            // 个推 SDK AAR 要求安装渠道占位符，不启用厂商通道时填任意值即可
            GT_INSTALL_CHANNEL: 'bibu_default',
        ]
    }
    signingConfigs {
        release {
            if (releaseSigningReady) {
                storeFile file(releaseKeystorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            if (releaseSigningReady) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
    // 个推 SDK Maven 仓库
    maven { url 'https://mvn.getui.com/nexus/content/repositories/releases/' }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.activity:activity-ktx:$androidxActivityVersion"
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    // 个推推送 SDK：gtc = 公共核心，gtsdk = 主推送，gsido = 数据采集
    implementation 'com.getui:gtc:3.3.3.0'
    implementation 'com.getui:gtsdk:3.3.15.0'
    implementation 'com.getui:gsido:1.4.14.0'
}

apply from: 'capacitor.build.gradle'
